<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1B3A5F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="외래강사 ON">
<title>외래강사 ON 홈 요약</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{--navy:#1B3A5F;--bg:#EEF1F5;--card:#fff;--line:#E2E6EC;--text:#1F2937;--muted:#6B7280;--warn:#B45309;--warn-bg:#FEF3C7;--err:#B42318;--err-bg:#FEE4E2;--ok:#067647;--ok-bg:#DCFAE6;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;}
  header{background:var(--navy);color:#fff;padding:14px 16px calc(12px);padding-top:calc(14px + env(safe-area-inset-top));}
  header b{font-size:17px;} header b span{color:#FDBA74;}
  header small{display:block;font-size:12px;opacity:.85;margin-top:2px;}
  main{max-width:640px;margin:0 auto;padding:12px 16px 32px;}
  .stamp{font-size:13px;color:var(--muted);font-weight:600;margin:2px 0 12px;}
  .card{background:var(--card);border-radius:12px;padding:14px 16px;margin-bottom:12px;}
  .card h2{font-size:16px;margin:0 0 8px;color:var(--navy);display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
  .card h2 small{font-size:12px;color:var(--muted);font-weight:600;}
  ul{list-style:none;margin:0;padding:0;}
  .todo li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-weight:600;}
  .todo li:first-child{border-top:0;}
  .todo li b{color:var(--navy);white-space:nowrap;}
  .mst{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .mst div{border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:#F8FAFC;}
  .mst span{display:block;font-size:12px;color:var(--muted);font-weight:600;}
  .mst b{display:block;font-size:19px;color:var(--navy);}
  .run{margin-top:8px;font-size:14px;color:var(--muted);font-weight:600;} .run b{color:var(--navy);}
  .course{border-left:5px solid var(--navy);background:#F8FAFC;border-radius:8px;padding:9px 11px;margin-top:8px;}
  .course .cn{font-weight:800;color:var(--navy);margin-bottom:4px;}
  .row{display:grid;grid-template-columns:92px 1fr;gap:8px;padding:6px 0;border-top:1px dashed var(--line);}
  .row:first-of-type{border-top:0;}
  .row .tm{font-size:12px;color:var(--muted);font-weight:700;line-height:1.35;}
  .row .sj{font-weight:700;}
  .row .ro{font-size:13px;color:var(--muted);}
  .need li,.week li{padding:9px 0;border-top:1px solid var(--line);}
  .need li:first-child,.week li:first-child{border-top:0;}
  .need .top,.week .top{display:flex;justify-content:space-between;gap:8px;font-weight:700;}
  .need small,.week small{display:block;font-size:12px;color:var(--muted);}
  .tag{display:inline-block;border-radius:12px;padding:1px 8px;font-size:12px;font-weight:700;white-space:nowrap;background:#EEF2F6;color:#475467;}
  .tag.err{background:var(--err-bg);color:var(--err);} .tag.warn{background:var(--warn-bg);color:var(--warn);}
  .empty{color:var(--muted);font-size:14px;padding:4px 0;}
  .none{background:var(--card);border-radius:12px;padding:22px 18px;text-align:center;}
  .none b{display:block;font-size:17px;color:var(--navy);margin-bottom:6px;}
  .foot{font-size:13px;color:var(--muted);line-height:1.6;margin-top:6px;}
  button.clear{margin-top:10px;border:1px solid #CBD4E0;background:#fff;border-radius:8px;padding:8px 14px;font:inherit;font-weight:700;color:var(--navy);}
</style>
</head>
<body>
<header><b>소방교육 외래강사 <span>ON</span></b><small>휴대폰 홈 요약 (보기 전용)</small></header>
<main id="app"></main>
<script>
/* 휴대폰 홈 요약(11-10)
 * - 노트북 홈의 [휴대폰으로 보기] QR을 찍으면 주소 # 뒤에 담긴 요약을 읽어 보여 줌. # 뒤 내용은 서버로 전송되지 않음
 * - 읽은 내용은 이 휴대폰에만 '그날만' 기억하고(자정 지나면 지움), 주소창에서는 바로 지움(바탕화면 아이콘에 남지 않게) */
(function(){
  'use strict';
  var KEY = 'ion_mobile_home_v1';
  var DOW = ['일','월','화','수','목','금','토'];
  function today(){ var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); }
  function load(){ try { var j = JSON.parse(localStorage.getItem(KEY) || 'null'); return j && j.v === 1 ? j : null; } catch (e) { return null; } }
  function save(o){ try { localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) {} }
  function clear(){ try { localStorage.removeItem(KEY); } catch (e) {} }
  function unb64(s){ s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function unpack(p){
    var kind = p.charAt(0), u = unb64(p.slice(1));
    if (kind === 'j') return Promise.resolve(JSON.parse(new TextDecoder().decode(u)));
    if (kind !== 'z') return Promise.reject(new Error('형식'));
    if (!window.DecompressionStream) return Promise.reject(new Error('이 휴대폰 브라우저가 오래되어 내용을 풀지 못했습니다. 브라우저를 최신으로 업데이트해 주세요.'));
    var ds = new DecompressionStream('deflate-raw'), w = ds.writable.getWriter(); w.write(u); w.close();
    return new Response(ds.readable).text().then(JSON.parse);
  }
  function tagCls(t){ return /진행 중|D-([0-9]|1[0-4])$/.test(t) ? 'err' : /D-(1[5-9]|2[0-9]|30)$/.test(t) ? 'warn' : ''; }
  function render(msg){
    var app = document.getElementById('app'), o = load();
    if (o && o.d !== today()) { clear(); o = null; }
    if (!o) {
      app.innerHTML = '<div class="none"><b>오늘 가져온 내용이 없습니다</b>' + (msg ? '<div style="color:#B42318;margin-bottom:6px;">' + esc(msg) + '</div>' : '') +
        '노트북 홈의 <b style="display:inline;font-size:inherit">[휴대폰으로 보기]</b>를 누르고 나오는 QR을 이 휴대폰 카메라로 찍어 주세요.<div class="foot">찍은 내용은 그날 자정까지만 이 휴대폰에 남습니다.</div></div>';
      return;
    }
    var p = o.d.split('-'), dt = new Date(+p[0], +p[1] - 1, +p[2]);
    var h = '<div class="stamp">' + (+p[1]) + '월 ' + (+p[2]) + '일 (' + DOW[dt.getDay()] + ') ' + esc(o.t) + ' 노트북에서 가져온 내용</div>';
    h += '<section class="card"><h2>처리할 일</h2>' + ((o.todo || []).length ? '<ul class="todo">' + o.todo.map(function(x){ return '<li><span>' + esc(x[0]) + '</span><b>' + esc(x[1]) + '</b></li>'; }).join('') + '</ul>' : '<div class="empty">처리할 일이 없습니다.</div>') + '</section>';
    var td = o.today || [];
    h += '<section class="card"><h2>오늘 수업 <small>' + td.reduce(function(n, c){ return n + c.r.length; }, 0) + '건</small></h2>' + (td.length ? td.map(function(c){
      return '<div class="course"><div class="cn">' + esc(c.c) + '</div>' + c.r.map(function(r){ return '<div class="row"><div class="tm">' + esc(r[0]).replace(' ', '<br>') + '</div><div><div class="sj">' + esc(r[1]) + '</div><div class="ro">' + esc(r[2] || '강의실 미정') + ' · ' + esc(r[3]) + '</div></div></div>'; }).join('') + '</div>';
    }).join('') : '<div class="empty">오늘 예정된 수업이 없습니다.</div>') + '</section>';
    if ((o.mon || []).length) h += '<section class="card"><h2>이번 달 교육 현황</h2><div class="mst">' + o.mon.map(function(x){ return '<div><span>' + esc(x[0]) + '</span><b>' + esc(x[1]) + '</b></div>'; }).join('') + '</div>' + (o.run ? '<div class="run">지금 진행 중 <b>' + esc(o.run) + '</b></div>' : '') + '</section>';
    if (o.need) h += '<section class="card"><h2>편성이 필요한 과정</h2>' + (o.need.length ? '<ul class="need">' + o.need.map(function(x){ return '<li><div class="top"><span>' + esc(x[0]) + '</span><span class="tag ' + tagCls(x[2]) + '">' + esc(x[2]) + '</span></div><small>' + esc(x[1]) + '</small></li>'; }).join('') + '</ul>' : '<div class="empty">2개월 이내에 시작하는 과정은 모두 편성되어 있습니다.</div>') + '</section>';
    if (o.week) h += '<section class="card"><h2>이번 주 과정 <small>' + esc(o.wk || '') + '</small></h2>' + (o.week.length ? '<ul class="week">' + o.week.map(function(x){ return '<li><div class="top"><span>' + esc(x[0]) + '</span></div><small>' + esc(x[1]) + '</small><small>' + esc(x[2]) + '</small></li>'; }).join('') + '</ul>' : '<div class="empty">이 주에 진행되는 과정이 없습니다.</div>') + '</section>';
    h += '<div class="foot">새 내용은 노트북 홈의 [휴대폰으로 보기] QR을 다시 찍으면 바뀝니다. 이 내용은 이 휴대폰에만 있고 오늘 자정이 지나면 지워집니다.<br><button type="button" class="clear" id="clr">지금 지우기</button></div>';
    app.innerHTML = h;
    document.getElementById('clr').onclick = function(){ clear(); render(); };
  }
  var m = /^#d=([A-Za-z0-9_-]+)$/.exec(location.hash);
  if (m) {
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    unpack(m[1]).then(function(o){
      if (!o || o.v !== 1 || !o.d) throw new Error('QR 내용을 읽지 못했습니다.');
      if (o.d !== today()) throw new Error('다른 날짜에 만든 QR입니다. 노트북에서 QR을 다시 만들어 찍어 주세요.');
      save(o); render();
    }).catch(function(e){ render(e && e.message || 'QR 내용을 읽지 못했습니다.'); });
  } else render();
  /* 열어 둔 채 자정을 넘기면 지움 */
  setInterval(function(){ var o = load(); if (o && o.d !== today()) render(); }, 60000);
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) render(); });
})();
</script>
</body>
</html>
